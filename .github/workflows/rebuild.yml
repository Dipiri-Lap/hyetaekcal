name: scheduled-rebuild
# Hourly rebuild (GitHub cron can be delayed) so scheduled posts go live close to their time and D-day lists refresh.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
